<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aangan Desk</title>
<meta name="description" content="AI front desk for Aangan Studio: every phone enquiry answered, qualified against Nikhil's rules and handed to a designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: fixed sidebar + topbar; views swap in the main column. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#070b1a; --panel:#0d1428; --panel2:#111a33; --line:#1e2a4a; --line2:#26355c;
  --fg:#e8ecf7; --muted:#8a96b8; --dim:#5d6a8f;
  --blue:#2f7bff; --blue2:#5b9bff; --green:#22c38e; --amber:#f5b544; --red:#f2576b; --grey:#8e9ab8; --violet:#7b5cff;
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f)}
a{color:var(--blue2)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:18px;min-height:100vh}
/* sidebar */
.side{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:18px;height:calc(100vh - 36px)}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,#4d8dff,#7b5cff);display:grid;place-items:center;box-shadow:0 8px 24px #2f7bff55}
.brand b{display:block;font-size:14px;letter-spacing:.16em}
.brand span{font-size:12px;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navgroup h4{margin:0 0 6px 10px;font-size:12px;font-weight:600;color:var(--dim)}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}
.nav.on{background:#18223f;color:var(--fg)}.nav.on .ic{background:var(--blue);border-color:var(--blue)}
.nav:hover{color:var(--fg)}
.badge{margin-left:auto;background:#3a1a2b;color:var(--red);font-size:11px;font-weight:700;padding:1px 8px;border-radius:10px}
.promo{margin-top:auto;border-radius:16px;padding:16px;background:linear-gradient(150deg,#4b2fd6,#2a1d6e 70%);border:1px solid #5a43e0}
.promo b{display:block;font-size:15px;margin-bottom:4px}.promo p{margin:0 0 12px;font-size:12.5px;color:#d3ccff}
.promo button{width:100%;padding:9px;border-radius:10px;border:0;background:#0d0a26;font-weight:700;cursor:pointer}
/* main */
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
.crumb{margin-right:auto}.crumb small{color:var(--muted);font-size:13px}.crumb h1{margin:0;font-size:18px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:8px 12px;min-width:220px}
.search input{background:none;border:0;outline:0;color:var(--fg);font:inherit;width:100%}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.g{background:var(--green);box-shadow:0 0 8px var(--green)}.dot.r{background:var(--red)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:700}.card .sub{color:var(--muted);font-size:13px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}.kpi .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:12.5px;font-weight:700;color:var(--green);margin-left:6px}
.kpi .ico{width:44px;height:44px;border-radius:12px;background:var(--blue);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px #2f7bff44}
.grid3{display:grid;grid-template-columns:1.25fr 1fr 1.25fr;gap:14px}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.hello small{color:var(--muted)}.hello h2{margin:4px 0 8px;font-size:28px;font-weight:800;letter-spacing:-.01em}
.hello p{color:var(--muted);margin:0 0 14px;font-size:15px}
.todo{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.todo div{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:13.5px;cursor:pointer;background:#0b1224}
.todo div:hover{border-color:var(--blue)}
.todo .dot{margin-top:6px;flex:none}
.link{background:none;border:0;color:var(--fg);font-weight:700;cursor:pointer;padding:0}
.gauge{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:8px}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#0b1224;border:1px solid var(--line2);border-radius:14px;padding:14px;width:100%;font-size:12.5px;color:var(--muted)}
.compare b{display:block;text-align:center;font-size:26px;color:var(--fg)}
.mix{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center;margin-top:14px}
.mix .tile{border:1px solid var(--line2);border-radius:12px;padding:9px 12px;margin-bottom:8px;background:#0b1224}
.mix .tile span{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.mix .tile b{font-size:18px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:3px}
.reasons{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.reasons div{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13.5px}
.bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
/* chips, table */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--dim);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover td{background:#0f1830}
.who{display:flex;align-items:center;gap:10px}.av{width:30px;height:30px;border-radius:50%;background:#1d2a50;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.who small{display:block;color:var(--muted);font-size:12px}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:3px 10px;border-radius:12px;border:1px solid}
.q{color:var(--green);border-color:#1f5f4a;background:#0d2a22}.u{color:var(--amber);border-color:#6a5222;background:#2a2112}.n{color:var(--grey);border-color:#3a4566;background:#151d36}.x{color:var(--red);border-color:#6b2633;background:#2b111a}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto}
.col{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:14px}.col h4 small{margin-left:auto;color:var(--muted)}
.lead{background:#0b1224;border:1px solid var(--line2);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.lead:hover{border-color:var(--blue)}.lead b{font-size:14px}.lead p{margin:0;font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:#18223f;color:var(--muted)}
/* rules */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rule .n{font-family:var(--mono);color:var(--blue2);font-size:12px}
.rule h4{margin:4px 0 6px;font-size:15px}.rule p{margin:0 0 12px;color:var(--muted);font-size:13px}
.split{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.cut{background:linear-gradient(150deg,#2a1d6e,#120f33);border-color:#4b3bb0}
blockquote{margin:10px 0;padding:12px 14px;border-left:3px solid var(--violet);background:#ffffff08;border-radius:0 10px 10px 0;font-size:14px}
/* how */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.step{border:1px solid var(--line2);border-radius:14px;padding:14px;background:#0b1224}
.step b{display:block;margin-bottom:4px}.step p{margin:0;color:var(--muted);font-size:13px}
.mapimg{width:100%;border-radius:14px;border:1px solid var(--line2);background:#fff;display:block}
/* drawer */
.scrim{position:fixed;inset:0;background:#02040cb3;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer.on{transform:none}
.drawer .head{display:flex;align-items:flex-start;gap:12px}.drawer h2{margin:0;font-size:20px}
.x-btn{margin-left:auto;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;width:34px;height:34px;cursor:pointer}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields div{background:#0b1224;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;min-width:0}
.fields small{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tests{display:flex;flex-wrap:wrap;gap:6px}
pre{white-space:pre-wrap;word-break:break-word;background:#0b1224;border:1px solid var(--line2);border-radius:12px;padding:12px;margin:0;font:13px/1.55 var(--f)}
details summary{cursor:pointer;font-weight:700;margin-bottom:8px}
.empty{color:var(--muted);padding:24px;text-align:center}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
@media (max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}.grid3,.grid2{grid-template-columns:1fr}}
@media (max-width:820px){.app{grid-template-columns:1fr;padding:16px}.side{position:static;height:auto}.promo{display:none}.navgroup{flex-direction:row;flex-wrap:wrap}.navgroup h4{display:none}.nav{width:auto}.search{min-width:0;flex:1}}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.mix{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></svg></div>
      <div><b>AANGAN DESK</b><span>AI front desk for Aangan Studio</span></div>
    </div>
    <div class="navgroup">
      <h4>Today</h4>
      <button class="nav on" data-view="overview"><span class="ic">⌂</span>Overview</button>
      <button class="nav" data-view="board"><span class="ic">▥</span>Leads board<span class="badge" id="needBadge">0</span></button>
      <button class="nav" data-view="calls"><span class="ic">☏</span>Calls</button>
    </div>
    <div class="navgroup">
      <h4>Explain</h4>
      <button class="nav" data-view="rules"><span class="ic">⚖</span>Rules</button>
      <button class="nav" data-view="how"><span class="ic">▶</span>How it works</button>
    </div>
    <div class="promo">
      <b>Why can't it quote prices?</b>
      <p>The one thing Nikhil asked for that we cut.</p>
      <button data-view="rules">Read the reasoning</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div class="crumb"><small>Aangan Studio / </small><small id="crumbName" style="color:var(--fg);font-weight:700">Overview</small><h1 id="viewTitle">Overview</h1></div>
      <label class="search"><span class="muted">⌕</span><input id="q" type="search" placeholder="Search caller or area" aria-label="Search caller or area"></label>
      <span class="pill" id="health"><span class="dot"></span>Checking…</span>
      <div class="seg" role="group" aria-label="Data source">
        <button id="modeReplay" class="on">Replay · Sept 2026</button>
        <button id="modeLive">Live</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Call details"></aside>

<script>
const V = {
  qualified: { label: "Qualified", cls: "q", color: "var(--green)" },
  unsure: { label: "Needs a decision", cls: "u", color: "var(--amber)" },
  not_a_fit: { label: "Declined", cls: "n", color: "var(--grey)" },
  urgent_existing_client: { label: "Existing client", cls: "x", color: "var(--red)" },
};
const ORDER = ["qualified", "unsure", "not_a_fit", "urgent_existing_client"];
const state = { mode: "replay", view: "overview", filter: "all", q: "", data: { replay: null, live: null } };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const inr = (n) => "₹" + Math.round(n).toLocaleString("en-IN");
const mmss = (s) => (s ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : "–");
const median = (a) => { const b = a.filter((x) => x > 0).sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };
const initials = (n) => String(n || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
const vOf = (c) => (V[c.verdict] ? c.verdict : "unsure");
const nameOf = (c) => c.caller || `Caller ${c.id}`;
const when = (c) => { const d = new Date(c.date + "T00:00:00Z"); return `${d.getUTCDate()} ${d.toLocaleString("en-IN", { month: "short", timeZone: "UTC" })}${c.time ? ", " + c.time : ""}`; };

async function load(mode) {
  if (state.data[mode]) return state.data[mode];
  const url = mode === "replay" ? "/data/replay-sept.json" : "/api/live";
  try {
    const j = await (await fetch(url)).json();
    state.data[mode] = j.calls ? j : { calls: [] };
  } catch { state.data[mode] = { calls: [], error: true }; }
  return state.data[mode];
}
function calls() {
  const d = state.data[state.mode] || { calls: [] };
  const q = state.q.toLowerCase();
  return d.calls.filter((c) => !q || `${nameOf(c)} ${c.location || ""}`.toLowerCase().includes(q));
}
function stats(list) {
  const by = Object.fromEntries(ORDER.map((k) => [k, list.filter((c) => vOf(c) === k)]));
  const cost = list.reduce((t, c) => t + Number(c.cost || 0), 0);
  return { by, total: list.length, after: list.filter((c) => c.afterHours).length, cost, handoff: median(list.map((c) => c.processingSeconds || 0)) };
}

function icon(p) { return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`; }
const ICONS = {
  phone: icon('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'),
  send: icon('<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>'),
  clock: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  rupee: icon('<path d="M6 4h12M6 9h12M9 4c4 0 6 2 6 5s-2 5-6 5H6l8 7"/>'),
};

function kpis(s) {
  const q = s.by.qualified.length, x = s.by.urgent_existing_client.length;
  const items = [
    ["Calls answered", `${s.total}/${s.total}`, s.after ? `+${s.after} after hours` : "", ICONS.phone],
    ["Sent to designers", q, x ? `+${x} to Nikhil` : "", ICONS.send],
    ["Median handoff", s.handoff ? `${Math.floor(s.handoff / 60)}m ${Math.round(s.handoff % 60)}s` : "–", s.handoff ? "call end → note ready" : "", ICONS.clock],
    ["Cost per qualified lead", q ? inr(s.cost / q) : "–", `${inr(s.cost)} total`, ICONS.rupee],
  ];
  return `<div class="kpis">${items.map(([l, v, e, i]) => `<div class="card kpi"><div><div class="l">${l}</div><div class="v">${v}${e ? `<em>${e}</em>` : ""}</div></div><div class="ico">${i}</div></div>`).join("")}</div>`;
}

function gauge(pct) {
  const r = 80, cx = 100, cy = 100, a0 = Math.PI, a1 = Math.PI * (1 - pct);
  const pt = (a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1), [xe, ye] = pt(0);
  return `<svg viewBox="0 0 200 120" width="220" role="img" aria-label="${Math.round(pct * 100)}% answered within 5 minutes">
    <path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${xe} ${ye}" stroke="#1e2a4a" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="var(--blue)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="98" r="22" fill="var(--blue)"/><g transform="translate(88 86)">${ICONS.phone.replace('width="20" height="20"', 'width="24" height="24"')}</g>
    <text x="20" y="118" fill="#8a96b8" font-size="10" text-anchor="middle">0%</text><text x="180" y="118" fill="#8a96b8" font-size="10" text-anchor="middle">100%</text></svg>`;
}

function donut(s) {
  const r = 52, C = 2 * Math.PI * r; let off = 0;
  const segs = ORDER.map((k) => { const n = s.by[k].length; const len = s.total ? (n / s.total) * C : 0; const seg = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${V[k].color}" stroke-width="12" stroke-dasharray="${Math.max(len - 3, 0)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" stroke-linecap="round"/>`; off += len; return n ? seg : ""; }).join("");
  return `<svg viewBox="0 0 140 140" width="150" role="img" aria-label="Outcome mix"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#1e2a4a" stroke-width="12"/>${segs}
    <text x="70" y="62" text-anchor="middle" fill="#8a96b8" font-size="10">Qualified</text><text x="70" y="84" text-anchor="middle" fill="#e8ecf7" font-size="24" font-weight="800">${s.by.qualified.length}</text><text x="70" y="98" text-anchor="middle" fill="#8a96b8" font-size="9">of ${s.total} calls</text></svg>`;
}

function perDay(list) {
  if (!list.length) return `<div class="empty">No calls yet.</div>`;
  // Work in UTC so date strings never shift with the viewer's timezone.
  const dates = list.map((c) => c.date).sort();
  const start = new Date(dates[0] + "T00:00:00Z"), end = new Date(dates[dates.length - 1] + "T00:00:00Z");
  if (state.mode === "replay") { start.setUTCDate(1); end.setUTCDate(30); }
  const days = []; for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) days.push(d.toISOString().slice(0, 10));
  const max = Math.max(1, ...days.map((d) => list.filter((c) => c.date === d).length));
  const W = 640, H = 170, pad = 24, bw = Math.max(4, (W - pad * 2) / days.length - 4);
  const bars = days.map((d, i) => {
    let y = H - 22; const x = pad + i * ((W - pad * 2) / days.length);
    const dayCalls = list.filter((c) => c.date === d);
    const rects = ORDER.map((k) => dayCalls.filter((c) => vOf(c) === k).map(() => { const h = (H - 50) / max; y -= h; return `<rect x="${x}" y="${y + 1}" width="${bw}" height="${h - 2}" rx="3" fill="${V[k].color}"/>`; }).join("")).join("");
    const night = dayCalls.some((c) => c.afterHours) ? `<circle cx="${x + bw / 2}" cy="${y - 7}" r="3" fill="var(--violet)"/>` : "";
    const lbl = i % 5 === 0 || i === days.length - 1 ? `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" fill="#5d6a8f" font-size="10">${Number(d.slice(8))}</text>` : "";
    return rects + night + lbl;
  }).join("");
  const grid = [0, 0.5, 1].map((t) => { const y = H - 22 - t * (H - 50); return `<line x1="${pad}" x2="${W - pad}" y1="${y}" y2="${y}" stroke="#1e2a4a"/><text x="${pad - 6}" y="${y + 3}" text-anchor="end" fill="#5d6a8f" font-size="10">${Math.round(t * max)}</text>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls per day">${grid}${bars}</svg></div>
    <div class="legend">${ORDER.map((k) => `<span><i class="sw" style="background:${V[k].color}"></i>${V[k].label}</span>`).join("")}<span><i class="sw" style="background:var(--violet);border-radius:50%"></i>After hours</span></div>`;
}

function overview() {
  const list = calls(), s = stats(list);
  const hour = Number(new Date().toLocaleString("en-IN", { hour: "numeric", hour12: false, timeZone: "Asia/Kolkata" }));
  const greet = hour < 12 ? "Morning" : hour < 17 ? "Afternoon" : "Evening";
  const need = [...s.by.urgent_existing_client, ...s.by.unsure];
  const reasons = {}; s.by.not_a_fit.forEach((c) => { const r = c.reason || "Not a fit"; reasons[r] = (reasons[r] || 0) + 1; });
  const rlist = Object.entries(reasons).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `${kpis(s)}
  <div class="grid3">
    <div class="card hello"><small>${greet},</small><h2>Nikhil Deshpande</h2>
      <p>Every call was answered.${need.length ? ` ${need.length} need${need.length === 1 ? "s" : ""} a person.` : " Nothing needs you right now."}</p>
      <div class="todo">${need.slice(0, 4).map((c) => `<div data-call="${esc(c.id)}"><span class="dot" style="background:${V[vOf(c)].color}"></span><span><b>${esc(nameOf(c))}</b> · ${esc(c.next_action || c.reason || "Review")}</span></div>`).join("") || `<div><span class="dot g"></span>All qualified leads are with designers.</div>`}</div>
      <button class="link" data-view="board">Open the leads board →</button></div>
    <div class="card"><h3>Answered within 5 minutes</h3><div class="sub">Nikhil's target, on every call</div>
      <div class="gauge">${gauge(s.total ? 1 : 0)}
        <div class="compare"><span>With<br>Aangan Desk</span><b>${s.total ? "100%" : "–"}<small style="display:block;font-size:12px;color:var(--muted);font-weight:500">AI picks up, any hour</small></b><span style="text-align:right">Before (manual):<br>~48% got no reply in 48 h</span></div></div></div>
    <div class="card"><h3>Outcome mix</h3><div class="sub">Decided by Nikhil's five tests; people make the final call</div>
      <div class="mix"><div>${["unsure", "not_a_fit", "urgent_existing_client"].map((k) => `<div class="tile"><span><i class="dot" style="background:${V[k].color}"></i>${V[k].label}</span><b>${s.by[k].length}</b></div>`).join("")}</div>${donut(s)}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Calls answered ${state.mode === "replay" ? "in September" : "so far"}</h3><div class="sub">Coloured by outcome; dots mark after-hours calls the front desk would have missed</div>${perDay(list)}</div>
    <div class="card"><h3>Why leads were declined</h3><div class="sub">Every decline has a written reason</div>
      <div class="reasons">${rlist.map(([r, n]) => `<div><span>${esc(r)}</span><b class="mono">${n}</b><span class="bar"><i style="width:${(n / Math.max(1, s.by.not_a_fit.length)) * 100}%"></i></span></div>`).join("") || `<div class="muted">No declines yet.</div>`}</div></div>
  </div>`;
}

function board() {
  const list = calls();
  return `<div class="board">${ORDER.map((k) => { const items = list.filter((c) => vOf(c) === k); return `<div class="col"><h4><span class="dot" style="background:${V[k].color}"></span>${V[k].label}<small>${items.length}</small></h4>
    ${items.map((c) => `<div class="lead" data-call="${esc(c.id)}"><b>${esc(nameOf(c))}</b><p>${esc([c.carpet_area, c.location].filter(Boolean).join(" · ") || "Details not given")}</p><p>${esc(c.reason || "")}</p>
      <div class="tags">${c.stage ? `<span class="tag">${esc(c.stage)}</span>` : ""}${c.afterHours ? `<span class="tag">After hours</span>` : ""}${(c.flags || []).slice(0, 2).map((f) => `<span class="tag">${esc(f)}</span>`).join("")}${c.test ? `<span class="tag">Test</span>` : ""}</div></div>`).join("") || `<p class="muted" style="font-size:13px">None</p>`}</div>`; }).join("")}</div>`;
}

function callsView() {
  const all = calls();
  const f = state.filter;
  const list = all.filter((c) => f === "all" || (f === "after" ? c.afterHours : vOf(c) === f));
  const chips = [["all", "All"], ...ORDER.map((k) => [k, V[k].label]), ["after", "After hours"]];
  return `<div class="card"><h3>Every call</h3><div class="sub">Open one for the brief, the five tests and the transcript</div>
    <div class="chips">${chips.map(([k, l]) => `<button class="chip ${f === k ? "on" : ""}" data-filter="${k}">${l}</button>`).join("")}</div>
    <div class="tablewrap"><table><thead><tr><th>Caller</th><th>When</th><th>Length</th><th>Status</th><th>Why</th><th>Handoff</th></tr></thead><tbody>
    ${list.map((c) => `<tr data-call="${esc(c.id)}"><td><div class="who"><span class="av">${initials(nameOf(c))}</span><span>${esc(nameOf(c))}<small>${esc(c.location || "area not given")}</small></span></div></td>
      <td class="mono">${esc(when(c))}</td><td class="mono">${mmss(c.seconds)}</td><td><span class="st ${V[vOf(c)].cls}">${V[vOf(c)].label}</span></td>
      <td>${esc(c.reason || "")}</td><td class="mono">${c.processingSeconds && vOf(c) !== "not_a_fit" ? c.processingSeconds + "s" : "–"}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">No calls match.</td></tr>`}
    </tbody></table></div></div>`;
}

function rules() {
  const list = (state.data.replay || { calls: [] }).calls;
  const T = [["real_project", "Real project, not just advice", "They want design and execution. Red flags: “just ideas”, “come and advise”."],
    ["service_area", "In Pune or PCMC", "Talegaon, Nashik, Mumbai and other cities are declined politely."],
    ["timeline", "Realistic timeline", "Site available within 8–10 weeks; nothing that must finish in under ~6 weeks."],
    ["budget", "Budget not clearly too low", "Never asked. Only a volunteered number far below the scope fails."],
    ["decision_maker", "Decision-maker on the call", "Or authorised by them, like a son calling for parents who will attend."]];
  const tally = (k) => ["pass", "unclear", "fail"].map((r) => list.filter((c) => c.tests && c.tests[k] === r).length);
  return `<div class="rules">${T.map(([k, h, p], i) => { const [a, b, c] = tally(k), t = Math.max(1, a + b + c);
    return `<div class="card rule"><span class="n">TEST ${i + 1}</span><h4>${h}</h4><p>${p}</p><div class="split"><i style="width:${(a / t) * 100}%;background:var(--green)"></i><i style="width:${(b / t) * 100}%;background:var(--amber)"></i><i style="width:${(c / t) * 100}%;background:var(--red)"></i></div>
      <p class="mono" style="margin:8px 0 0">${a} pass · ${b} unclear · ${c} fail <span class="muted">(Sept replay)</span></p></div>`; }).join("")}
    <div class="card rule cut"><span class="n">THE CUT</span><h4>No price quotes</h4><p>Nikhil asked for per-sq-ft pricing on the call. pricing.md itself says the numbers are <b>“indicative only, varies by site”</b> and must never be quoted. On a ₹8–14 lakh project, a number from a bot sounds like a promise.</p>
      <blockquote>“Pricing depends on the site, the materials you choose, and the scope — your designer will walk you through it in detail at the consultation. I can book that for you right now if you'd like.”</blockquote><p>The agent collects carpet area and scope instead, so the designer can estimate on the first call.</p></div>
    <div class="card rule"><span class="n">NEVER DISQUALIFIES</span><h4>Things that don't count against a caller</h4><p>Not knowing exactly what they want · calling after hours · asking for price · unsure about style · a single room with full execution · a rented flat with no structural changes.</p></div>
  </div>`;
}

function how() {
  const steps = [["Vaani answers", "In seconds, 24×7. Asks one question at a time in English or Hinglish; never quotes a price."],
    ["Vaani extracts", "15 fields and a verdict from the call, using Nikhil's five tests."],
    ["Gemini writes the note", "A 20-second handoff: who, project, timeline, decision, their words, open questions."],
    ["HubSpot records it", "A contact and a deal in the “Aangan Enquiries” pipeline, with every field."],
    ["Telegram alerts designers", "In the “Aangan Leads” group, with Claim, Consultation booked and Not a fit buttons."],
    ["Nikhil sees it here", "Calls, outcomes, handoff time and the cost per qualified lead, with no manual counting."]];
  return `<div class="card"><h3>How a call becomes a booked consultation</h3><div class="sub">Phone channel only; WhatsApp and the web form would plug in at step 2</div>
    <div class="steps" style="margin-top:14px">${steps.map(([b, p], i) => `<div class="step"><span class="mono" style="color:var(--blue2)">0${i + 1}</span><b>${b}</b><p>${p}</p></div>`).join("")}</div></div>
    <div class="card"><h3>Components map</h3><div class="sub">Trigger → Input → Context → Processing → AI → Output</div><img class="mapimg" src="/components-map.png" alt="Components map of the Aangan enquiry system" style="margin-top:14px"></div>
    <div class="card"><h3>Proof it's running</h3><p class="muted" style="margin:6px 0 0">Live status: <a href="/api/health" target="_blank" rel="noopener">/api/health</a> · Code: <a href="https://github.com/asmijain-creator/aangan-enquiry-agent" target="_blank" rel="noopener">GitHub</a> · Built with Vaani, Gemini, HubSpot, Telegram and Vercel.</p></div>`;
}

const VIEWS = { overview: ["Overview", overview], board: ["Leads board", board], calls: ["Calls", callsView], rules: ["Rules", rules], how: ["How it works", how] };
async function render() {
  await load(state.mode); if (state.view === "rules") await load("replay");
  const [title, fn] = VIEWS[state.view];
  $("#viewTitle").textContent = title; $("#crumbName").textContent = title;
  document.querySelectorAll(".nav").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  const d = state.data[state.mode];
  $("#view").innerHTML = (d.error ? `<div class="card empty">Couldn't load ${state.mode === "live" ? "live leads" : "the replay"} right now.</div>` : "") + `<div style="display:flex;flex-direction:column;gap:18px">${fn()}</div>`;
  const s = stats(calls()); $("#needBadge").textContent = s.by.unsure.length + s.by.urgent_existing_client.length;
}

function openCall(id) {
  const c = (state.data[state.mode]?.calls || []).find((x) => String(x.id) === String(id)); if (!c) return;
  const v = V[vOf(c)];
  const F = [["Area", c.location], ["Property", c.property_type], ["Size", c.carpet_area], ["Scope", c.scope], ["Timeline", c.timeline], ["Decision", c.decision_maker], ["Source", c.source], ["Budget", c.budget_mentioned || "not asked"], ["When", when(c) + (c.afterHours ? " · after hours" : "")], ["Length · cost", `${mmss(c.seconds)} · ${inr(c.cost || 0)}`]];
  const tests = c.tests ? Object.entries(c.tests).map(([k, r]) => `<span class="st ${r === "pass" ? "q" : r === "fail" ? "x" : "u"}">${k.replace(/_/g, " ")}: ${r}</span>`).join("") : "";
  $("#drawer").innerHTML = `<div class="head"><span class="av" style="width:42px;height:42px;font-size:14px">${initials(nameOf(c))}</span><div><h2>${esc(nameOf(c))}</h2><span class="st ${v.cls}">${v.label}</span> ${c.stage ? `<span class="tag">${esc(c.stage)}</span>` : ""}</div><button class="x-btn" id="closeDrawer" aria-label="Close">✕</button></div>
    <div><b>Why:</b> ${esc(c.reason || "–")}</div>
    ${c.next_action ? `<div class="card" style="padding:12px 14px;background:#0b1224"><b>Next:</b> ${esc(c.next_action)}</div>` : ""}
    <div class="fields">${F.map(([l, val]) => `<div><small>${l}</small>${esc(val || "–")}</div>`).join("")}</div>
    ${tests ? `<div><b style="display:block;margin-bottom:8px">Nikhil's five tests</b><div class="tests">${tests}</div></div>` : ""}
    ${c.flags?.length ? `<div class="tags">${c.flags.map((f) => `<span class="tag">${esc(f)}</span>`).join("")}</div>` : ""}
    ${c.handoff_note ? `<div><b style="display:block;margin-bottom:8px">Designer handoff note</b><pre>${esc(c.handoff_note)}</pre></div>` : ""}
    ${c.transcript ? `<details><summary>Transcript</summary><pre>${esc(c.transcript)}</pre></details>` : state.mode === "live" ? `<p class="muted">Live mode hides notes, numbers and recordings. They stay in HubSpot.</p>` : ""}`;
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#closeDrawer").focus();
}
function closeCall() { $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }

document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]"); if (v) { state.view = v.dataset.view; closeCall(); render(); try { localStorage.setItem("desk.view", state.view); } catch {} return; }
  const f = e.target.closest("[data-filter]"); if (f) { state.filter = f.dataset.filter; render(); return; }
  const c = e.target.closest("[data-call]"); if (c) { openCall(c.dataset.call); return; }
  if (e.target.id === "scrim" || e.target.id === "closeDrawer") closeCall();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeCall(); });
$("#q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
const setMode = (m) => { state.mode = m; $("#modeReplay").classList.toggle("on", m === "replay"); $("#modeLive").classList.toggle("on", m === "live"); render(); };
$("#modeReplay").onclick = () => setMode("replay"); $("#modeLive").onclick = () => setMode("live");
try { const saved = localStorage.getItem("desk.view"); if (saved && VIEWS[saved]) state.view = saved; } catch {}
render();
fetch("/api/health").then((r) => r.json()).then((j) => { $("#health").innerHTML = `<span class="dot ${j.allConnected ? "g" : "r"}"></span>${j.allConnected ? "Answering 24/7" : "Check connections"}`; })
  .catch(() => { $("#health").innerHTML = `<span class="dot r"></span>Status unavailable`; });
</script>
</body>
</html>
